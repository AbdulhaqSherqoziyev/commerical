    (function(){

      var _f=window.fetch.bind(window);
      function J(o,s){return Promise.resolve(new Response(JSON.stringify(o),{status:s||200,headers:{'Content-Type':'application/json'}}));}
      function newCust(b){return {id:'demo',name:(b&&b.name)||'Demo mijoz',phone:(b&&b.phone)||'+998 90 000 00 00',email:'',avatar:'',addresses:[],orders:[],favorites:[]};}
      // mahsulot katalogini bitta marta bundle faylidan o'qib olamiz (id -> {name,brand,price})
      function catalog(){
        if(_cat)return Promise.resolve(_cat);
        var src=[].slice.call(document.querySelectorAll('script[src]')).map(function(s){return s.src;}).filter(function(u){return /\/assets\/index-.*\.js/.test(u);})[0];
        if(!src){_cat={};return Promise.resolve(_cat);}
        return _f(src).then(function(r){return r.text();}).then(function(t){
          var map={},re=/id:"(p-\d+)"/g,m;
          while((m=re.exec(t))){
            var seg=t.slice(m.index,m.index+700);
            var nm=(seg.match(/name:"([^"]*)"/)||[])[1];
            var br=(seg.match(/brand:"([^"]*)"/)||[])[1];
            var pr=(seg.match(/price:([0-9.eE+]+)/)||[])[1];
            if(!map[m[1]])map[m[1]]={name:nm||'Mahsulot',brand:br||'',price:Number(pr)||0};
          }
          _cat=map;return map;
        }).catch(function(){_cat={};return _cat;});
      }
      function buildOrder(cat,body){
        var cart=[];try{cart=(JSON.parse(localStorage.getItem('glowen-store')||'{}').cart)||[];}catch(e){}
        var lines=cart.map(function(it){var p=cat[it.id]||{};return {productId:it.id,name:p.name||'Mahsulot',brand:p.brand||'',qty:it.qty||1,price:p.price||0};});
        if(!lines.length&&body&&body.items)lines=body.items.map(function(it){var p=cat[it.productId]||{};return {productId:it.productId,name:p.name||'Mahsulot',brand:p.brand||'',qty:it.qty||1,price:p.price||0};});
        var total=lines.reduce(function(s,l){return s+l.price*l.qty;},0);
        var n=_orders.length+1;
        var order=Object.assign({},body||{},{id:'ORD-'+Date.now(),number:'A'+(100000+Math.floor(Math.random()*899999)),status:'new',createdAt:new Date().toISOString(),lines:lines,total:total});
        _orders.unshift(order);
        return order;

      window.fetch=function(input,init){
        var url=(input&&input.url)||input||''; url=String(url);
        var path=url; try{path=new URL(url,location.origin).pathname;}catch(e){}
        if(path.indexOf('/api/')!==0) return _f(input,init);

        var b={}; try{b=init&&init.body?(typeof init.body==='string'?JSON.parse(init.body):init.body):{};}catch(e){}
        // ---- AUTH ----
        if(path.indexOf('/api/auth/')===0){

          if(path.indexOf('verify')>=0){_c=newCust(b);return J({token:'demo-token',customer:_c});}

            return J({customer:_c||newCust()});
          }
          if(path.indexOf('logout')>=0){return J({ok:true});}
          return J({ok:true});

        // ---- ORDERS ----
        if(path==='/api/orders'&&method==='POST') return catalog().then(function(cat){return J({order:buildOrder(cat,b)});});
        if(path==='/api/orders'&&method==='GET') return J({orders:_orders});
        if(/^\/api\/orders\/[^/]+\/cancel/.test(path)){var id=path.split('/')[3];_orders.forEach(function(o){if(o.id===id)o.status='cancelled';});return J({ok:true});}

        // ---- PAYMENTS ----

        if(/^\/api\/payments\//.test(path)) return J({url:location.origin+location.pathname+'#/buyurtmalar',ok:true});
        // ---- boshqa har qanday /api ----
        return J({ok:true});
      };
      // ---- PASPORT inputi: 2 harf + 7 raqam (AA0000001), ko'proq qabul qilinmasin ----
      var nativeSet=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
      function isPassport(el){return el&&el.tagName==='INPUT'&&/^AA0*1?$/i.test((el.placeholder||'').replace(/\s/g,''));}
      document.addEventListener('input',function(e){
        var t=e.target;
        if(!isPassport(t))return;
        if(t.maxLength!==9)t.maxLength=9;
        var v=(t.value||'').toUpperCase();

        var nv=letters+digits;
        if(nv!==t.value){nativeSet.call(t,nv);t.dispatchEvent(new Event('input',{bubbles:true}));}
      },true);
    })();
