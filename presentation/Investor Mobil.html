  (function(){

    function find(){
      var best=null,ba=0,els=document.querySelectorAll('div');
      for(var i=0;i<els.length;i++){

    requestAnimationFrame(loop);
    setInterval(function(){ phEl=null; }, 3000);
  })();

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // createElement so they execute, awaiting onload for src scripts to

    console.error('Bundle unpack error:', err);

"<!DOCTYPE html>\n<html lang=\"uz\"><head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Investor kabineti<\/title>\n  <style>/* artel/app.css \u2014 white-label installment app design system */\n\n:root {\n  --ff: -apple-system, \"SF Pro Display\", \"SF Pro Text\", system-ui, \"Segoe UI\", sans-serif;\n  /* brand is injected from tweaks onto .app; fallbacks here */\n  --brand: var(--accent,#2E3192);\n  --brand-700: color-mix(in srgb, var(--brand) 78%, #000);\n  --brand-600: color-mix(in srgb, var(--brand) 90%, #000);\n  --brand-soft: color-mix(in srgb, var(--brand) 10%, #fff);\n  --brand-tint: color-mix(in srgb, var(--brand) 6%, #fff);\n  --on-brand: #fff;\n\n  --bg: #F1F3F6;\n  --surface: #FFFFFF;\n  --surface-2: #F6F7F9;\n  --ink: #0E1320;\n  --ink-2: #2B3242;\n  --muted: #757D8C;\n  --muted-2: #A6ADBA;\n  --line: rgba(14, 19, 32, 0.08);\n  --line-2: rgba(14, 19, 32, 0.05);\n\n  --ok: #1F9D5B;\n  --ok-soft: #E6F5EC;\n  --warn: #C8851A;\n  --warn-soft: #FBF1DE;\n  --danger: #D8472B;\n  --danger-soft: #FBE9E4;\n\n  --r: 22px;\n  --r-sm: 14px;\n  --r-lg: 28px;\n  --shadow: 0 1px 2px rgba(14,19,32,0.04), 0 8px 24px rgba(14,19,32,0.06);\n  --shadow-sm: 0 1px 2px rgba(14,19,32,0.05), 0 3px 10px rgba(14,19,32,0.04);\n}\n\n.app[data-density=\"compact\"] { --r: 16px; --r-sm: 11px; --r-lg: 22px; }\n.app[data-density=\"comfy\"]   { --r: 26px; --r-sm: 17px; --r-lg: 32px; }\n\n.app[data-dark=\"true\"] {\n  --bg: #0B0D12;\n  --surface: #161A22;\n  --surface-2: #1C212B;\n  --ink: #F4F6FA;\n  --ink-2: #D7DBE3;\n  --muted: #8B93A3;\n  --muted-2: #5A6273;\n  --line: rgba(255,255,255,0.09);\n  --line-2: rgba(255,255,255,0.05);\n  --brand-soft: color-mix(in srgb, var(--brand) 26%, #161A22);\n  --brand-tint: color-mix(in srgb, var(--brand) 16%, #161A22);\n  --ok-soft: color-mix(in srgb, var(--ok) 22%, #161A22);\n  --warn-soft: color-mix(in srgb, var(--warn) 22%, #161A22);\n  --danger-soft: color-mix(in srgb, var(--danger) 22%, #161A22);\n  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 3px 10px rgba(0,0,0,0.3);\n}\n\n* { box-sizing: border-box; }\n\n.app {\n  height: 100%;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--ff);\n  -webkit-font-smoothing: antialiased;\n  display: flex;\n  flex-direction: column;\n  position: relative;\n  letter-spacing: -0.01em;\n}\n.app button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }\n.app .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }\n\n/* \u2500\u2500 scroll region \u2500\u2500 */\n.scroll {\n  flex: 1;\n  overflow-y: auto;\n  overflow-x: hidden;\n  -webkit-overflow-scrolling: touch;\n  padding-bottom: 26px;\n}\n.scroll::-webkit-scrollbar { width: 0; }\n.has-tabs .scroll { padding-bottom: 96px; }\n\n/* \u2500\u2500 top app bar \u2500\u2500 */\n.appbar {\n  padding: 60px 20px 12px;\n  display: flex; align-items: center; justify-content: space-between; gap: 12px;\n  position: relative; z-index: 4;\n}\n.appbar.solid { background: var(--surface); border-bottom: 1px solid var(--line); }\n.appbar .greet small { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; font-weight: 500; }\n.appbar .greet b { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; }\n.appbar-title { font-size: 18px; font-weight: 680; letter-spacing: -0.02em; }\n\n.iconbtn {\n  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;\n  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); position: relative;\n}\n.iconbtn.flat { background: var(--surface-2); box-shadow: none; }\n.iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;\n  border-radius: 99px; background: var(--danger); border: 2px solid var(--surface); }\n\n.brandmark {\n  display: flex; align-items: center; gap: 9px;\n}\n.brandmark .logo {\n  height: 30px; min-width: 30px; padding: 0 9px; border-radius: 9px;\n  background: var(--brand); color: var(--on-brand);\n  display: grid; place-items: center;\n  font-weight: 800; font-size: 14px; letter-spacing: 0.04em;\n}\n.brandmark .sub { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }\n\n/* sub-nav back header */\n.subhead { padding: 56px 16px 10px; display: flex; align-items: center; gap: 6px; position: relative; z-index: 4; }\n.subhead .back { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); }\n.subhead h2 { margin: 0; font-size: 17px; font-weight: 680; flex: 1; }\n\n/* \u2500\u2500 containers \u2500\u2500 */\n.pad { padding: 0 20px; }\n.stack { display: flex; flex-direction: column; }\n.gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }\n.row { display: flex; align-items: center; }\n.between { justify-content: space-between; }\n.grow { flex: 1; }\n\n/* \u2500\u2500 card \u2500\u2500 */\n.card {\n  background: var(--surface); border-radius: var(--r);\n  box-shadow: var(--shadow); padding: 18px;\n}\n.card.tight { padding: 14px; }\n.card.flat { box-shadow: none; border: 1px solid var(--line); }\n\n.section-label {\n  font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em;\n  padding: 0 4px; display: flex; align-items: center; justify-content: space-between;\n}\n.section-label a { color: var(--brand); font-weight: 600; }\n\n/* \u2500\u2500 hero limit card \u2500\u2500 */\n.hero {\n  border-radius: var(--r-lg); padding: 22px;\n  background:\n    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--brand) 75%, #fff) 0%, transparent 55%),\n    linear-gradient(150deg, var(--brand) 0%, var(--brand-700) 100%);\n  color: var(--on-brand); position: relative; overflow: hidden;\n  box-shadow: 0 12px 30px color-mix(in srgb, var(--brand) 40%, transparent);\n}\n.hero .glow { position: absolute; right: -40px; top: -50px; width: 180px; height: 180px;\n  background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 70%); }\n.hero .k { font-size: 12.5px; opacity: 0.85; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: center; gap: 6px; }\n.hero .big { font-size: 38px; font-weight: 720; letter-spacing: -0.03em; margin: 6px 0 2px; line-height: 1; }\n.hero .big .cur { font-size: 17px; font-weight: 600; opacity: 0.8; margin-left: 6px; letter-spacing: 0; }\n.hero .meterwrap { margin-top: 16px; }\n.hero .meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.25); overflow: hidden; }\n.hero .meter > span { display: block; height: 100%; border-radius: 99px; background: #fff; }\n.hero .meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12px; font-weight: 500; }\n.hero .meta b { font-weight: 700; }\n.hero .meta .o { opacity: 0.78; }\n\n/* quick actions */\n.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n.qa {\n  background: var(--surface); border-radius: var(--r-sm); padding: 14px 8px 12px;\n  display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);\n  text-align: center;\n}\n.qa .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand);\n  display: grid; place-items: center; }\n.qa span { font-size: 11.5px; font-weight: 600; color: var(--ink-2); line-height: 1.2; }\n.qa:active { transform: scale(0.96); }\n.app .qa, .app .pressable { transition: transform 0.12s ease; }\n.pressable:active { transform: scale(0.98); }\n\n/* \u2500\u2500 list rows \u2500\u2500 */\n.lrow { display: flex; align-items: center; gap: 13px; padding: 13px 0; }\n.lrow + .lrow { border-top: 1px solid var(--line); }\n.lrow .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;\n  background: var(--surface-2); color: var(--ink-2); flex-shrink: 0; }\n.lrow .ic.brand { background: var(--brand-soft); color: var(--brand); }\n.lrow .tt { flex: 1; min-width: 0; }\n.lrow .tt b { font-size: 14.5px; font-weight: 620; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.lrow .tt small { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.lrow .rt { text-align: right; flex-shrink: 0; }\n.lrow .rt b { font-size: 14.5px; font-weight: 680; }\n.lrow .rt small { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; }\n\n/* \u2500\u2500 chips / status \u2500\u2500 */\n.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650;\n  padding: 4px 9px; border-radius: 99px; letter-spacing: 0; }\n.chip .d { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }\n.chip.ok { background: var(--ok-soft); color: var(--ok); }\n.chip.warn { background: var(--warn-soft); color: var(--warn); }\n.chip.danger { background: var(--danger-soft); color: var(--danger); }\n.chip.brand { background: var(--brand-soft); color: var(--brand); }\n.chip.flat { background: var(--surface-2); color: var(--muted); }\n\n/* \u2500\u2500 buttons \u2500\u2500 */\n.btn {\n  height: 54px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;\n  gap: 9px; font-size: 16px; font-weight: 660; width: 100%; letter-spacing: -0.01em; white-space: nowrap;\n  transition: transform 0.12s ease, opacity 0.12s ease;\n}\n.btn:active { transform: scale(0.98); }\n.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 30%, transparent); }\n.btn.dark { background: var(--ink); color: var(--surface); }\n.btn.soft { background: var(--brand-soft); color: var(--brand); }\n.btn.ghost { background: var(--surface-2); color: var(--ink); }\n.btn.outline { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }\n.btn:disabled { opacity: 0.4; pointer-events: none; }\n.btn.sm { height: 44px; font-size: 14.5px; border-radius: 13px; }\n\n/* sticky footer cta */\n.footer-cta {\n  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px;\n  background: linear-gradient(to top, var(--bg) 62%, transparent);\n  z-index: 6;\n}\n.footer-cta.surface { background: var(--surface); border-top: 1px solid var(--line); padding-bottom: 28px; }\n\n/* \u2500\u2500 tab bar \u2500\u2500 */\n.tabbar {\n  position: absolute; left: 0; right: 0; bottom: 0; height: 84px;\n  padding: 8px 8px 22px; z-index: 8;\n  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;\n  background: color-mix(in srgb, var(--surface) 86%, transparent);\n  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted-2); }\n.tab.active { color: var(--brand); }\n.tab span { font-size: 10.5px; font-weight: 600; }\n.tab .fab {\n  width: 50px; height: 50px; margin-top: -16px; border-radius: 17px; background: var(--brand);\n  color: var(--on-brand); display: grid; place-items: center;\n  box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 38%, transparent);\n}\n\n/* \u2500\u2500 inputs \u2500\u2500 */\n.field { background: var(--surface); border-radius: var(--r-sm); border: 1.5px solid var(--line);\n  padding: 13px 15px; display: flex; align-items: center; gap: 10px; transition: border-color 0.15s; }\n.field.focus, .field:focus-within { border-color: var(--brand); }\n.field label { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px; }\n.field input { border: 0; outline: 0; background: transparent; width: 100%; font-family: inherit;\n  font-size: 16px; font-weight: 600; color: var(--ink); }\n.field input::placeholder { color: var(--muted-2); font-weight: 500; }\n.fieldlbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 0 4px 7px; }\n\n/* segmented */\n.seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 4px; gap: 4px; }\n.seg button { flex: 1; height: 38px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); }\n.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }\n\n/* term / option selector */\n.optcard { border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 14px; background: var(--surface);\n  display: flex; align-items: center; gap: 12px; transition: border-color 0.15s, background 0.15s; }\n.optcard.on { border-color: var(--brand); background: var(--brand-tint); }\n.optcard .radio { width: 22px; height: 22px; border-radius: 99px; border: 2px solid var(--line); flex-shrink: 0;\n  display: grid; place-items: center; }\n.optcard.on .radio { border-color: var(--brand); }\n.optcard.on .radio::after { content: \"\"; width: 11px; height: 11px; border-radius: 99px; background: var(--brand); }\n\n/* schedule timeline */\n.sch { position: relative; }\n.sch .srow { display: flex; align-items: center; gap: 14px; padding: 11px 0; position: relative; }\n.sch .srow + .srow { border-top: 1px solid var(--line); }\n.sch .node { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; flex-shrink: 0;\n  font-size: 12px; font-weight: 700; border: 2px solid var(--line); color: var(--muted); background: var(--surface); }\n.sch .node.paid { background: var(--ok); border-color: var(--ok); color: #fff; }\n.sch .node.next { background: var(--brand); border-color: var(--brand); color: #fff; }\n.sch .node.overdue { background: var(--danger); border-color: var(--danger); color: #fff; }\n\n/* bottom sheet */\n.sheet-scrim { position: absolute; inset: 0; background: rgba(8,11,18,0.45); z-index: 30;\n  opacity: 0; transition: opacity 0.25s; }\n.sheet-scrim.show { opacity: 1; }\n.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;\n  background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 30px;\n  transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);\n  max-height: 86%; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }\n.sheet.show { transform: translateY(0); }\n.sheet .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }\n.sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }\n\n/* success check */\n.successmark { width: 88px; height: 88px; border-radius: 99px; background: var(--ok-soft); color: var(--ok);\n  display: grid; place-items: center; margin: 0 auto; animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }\n@keyframes pop { from { transform: scale(0.86); } to { transform: scale(1); } }\n\n/* fade for screen transitions \u2014 no fill-mode, so a non-running animation leaves content visible */\n.screen { animation: fadeUp 0.32s ease; height: 100%; display: flex; flex-direction: column; }\n@keyframes fadeUp { from { transform: translateY(10px); } to { transform: none; } }\n.scroll > .pad { animation: fadeUp 0.36s ease; }\n\n/* keypad */\n.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.keypad button { height: 56px; border-radius: 14px; font-size: 22px; font-weight: 600; background: var(--surface-2); }\n.keypad button:active { background: var(--brand-soft); color: var(--brand); }\n\n/* otp boxes */\n.otp { display: flex; gap: 10px; justify-content: center; }\n.otp .box { width: 48px; height: 58px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);\n  display: grid; place-items: center; font-size: 26px; font-weight: 700; }\n.otp .box.on { border-color: var(--brand); }\n.otp .box.cursor { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }\n\n/* spinner */\n.spinner { width: 54px; height: 54px; border-radius: 99px; border: 5px solid var(--brand-soft);\n  border-top-color: var(--brand); animation: spin 0.8s linear infinite; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* misc text */\n.muted { color: var(--muted); }\n.tiny { font-size: 11.5px; }\n.amount-display { font-size: 40px; font-weight: 740; letter-spacing: -0.03em; text-align: center; }\n.amount-display .cur { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 6px; }\n<\/style>\n  <style>/* investor/app-extra.css \u2014 investor-module components on top of the ARTEL shell */\n\n/* value / change chips */\n.vchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;\n  padding: 3px 8px; border-radius: 99px; letter-spacing: -0.01em; }\n.vchip.up { background: var(--ok-soft); color: var(--ok); }\n.vchip.down { background: var(--danger-soft); color: var(--danger); }\n.vchip.flat { background: var(--surface-2); color: var(--muted); }\n\n/* hero split bar (invested vs earned) */\n.splitbar { height: 10px; border-radius: 99px; overflow: hidden; display: flex; background: rgba(255,255,255,0.25); }\n.splitbar > span { display: block; height: 100%; }\n\n/* stat grid (2-up) */\n.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.stat { background: var(--surface); border-radius: var(--r-sm); padding: 15px; box-shadow: var(--shadow-sm); }\n.stat .k { font-size: 12px; color: var(--muted); font-weight: 550; display: flex; align-items: center; gap: 6px; }\n.stat .k .si { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;\n  background: var(--brand-soft); color: var(--brand); flex-shrink: 0; }\n.stat .v { font-size: 20px; font-weight: 720; letter-spacing: -0.02em; margin-top: 9px; }\n.stat .v .cur { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; letter-spacing: 0; }\n.stat .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }\n\n/* donut (share) */\n.donut { position: relative; width: 168px; height: 168px; margin: 0 auto; }\n.donut svg { transform: rotate(-90deg); display: block; }\n.donut .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }\n.donut .mid .pct { font-size: 30px; font-weight: 760; letter-spacing: -0.03em; line-height: 1; }\n.donut .mid .lbl { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 3px; }\n\n/* legend rows */\n.legend { display: flex; flex-direction: column; gap: 11px; }\n.legrow { display: flex; align-items: center; gap: 10px; }\n.legrow .sw { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0; }\n.legrow .nm { font-size: 13.5px; font-weight: 550; flex: 1; }\n.legrow .vv { font-size: 13.5px; font-weight: 700; }\n.legrow .pp { font-size: 11.5px; color: var(--muted); font-weight: 600; min-width: 42px; text-align: right; }\n\n/* bar chart (monthly income) */\n.barchart { display: flex; align-items: flex-end; gap: 9px; height: 150px; padding-top: 8px; }\n.barcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }\n.barcol .bar { width: 100%; max-width: 26px; border-radius: 7px 7px 4px 4px; background: var(--brand);\n  transition: height 0.5s cubic-bezier(.3,.8,.3,1); min-height: 4px; }\n.barcol .bar.soft { background: var(--brand-soft); }\n.barcol .bl { font-size: 10.5px; color: var(--muted); font-weight: 600; }\n.barcol.on .bar { background: var(--brand); box-shadow: 0 6px 14px color-mix(in srgb, var(--brand) 35%, transparent); }\n.barcol.on .bl { color: var(--ink); font-weight: 700; }\n\n/* sparkline area */\n.spark-area { width: 100%; height: 56px; display: block; }\n\n/* statement / accrual rows reuse .lrow; add status pills already exist */\n\n/* transparency metric rows */\n.metric { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }\n.metric + .metric { border-top: 1px so
