<style>
/* ZOODMALL rang tizimi (ZOOD prezentatsiyasidan). O'zgaruvchi nomlari tarixiy
   sabab bilan --teal deb qolgan, qiymatlari ZOOD binafshasi. */
:root{--teal:#2E3192;--teal2:#4A4FC4;--teald:#262878;--red:#F03E3B;--ink:#171A2B;--mut:#7C8398;--bg:#F4F5FA;--card:#fff;--line:#E7EAF2;--soft:#ECEDF9;--fabtxt:#7C8398}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#262878,#20235E 60%,#141637);height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body.embed,html.embed body{background:transparent}
.device{width:390px;height:844px;max-height:calc(100vh - 24px);background:#000;border-radius:52px;padding:11px;box-shadow:0 0 0 2px #1c1c1e;position:relative;flex-shrink:0}
.screenwrap{width:100%;height:100%;background:var(--bg);border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:20px;z-index:60}
.status{height:52px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:14px;font-weight:700;color:var(--ink);z-index:50}
.status .r{display:flex;align-items:center;gap:6px}
.app{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen.on{display:block}
.screen::-webkit-scrollbar{display:none}
/* header */
.hd{position:sticky;top:0;z-index:30;background:var(--bg);padding:6px 16px 8px}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.loc{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#4b5563}
/* .logo ikki vazifada: brend wordmark EMAS (u endi rasm), balki "KATALOG"/"SAVAT"
   kabi ekran sarlavhalari uchun ishlatiladi. */
.logo{font-family:'Nunito Sans';font-weight:900;font-size:24px;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:center;gap:3px}
/* ZOODMALL wordmark: tungi rejimda oq variantga o'tadi */
.brandlogo{height:22px;width:auto;display:block;object-fit:contain}
.brandlogo.w{display:none}
.screenwrap.dark .brandlogo.d{display:none}
.screenwrap.dark .brandlogo.w{display:block}
.mm-brand{display:flex;align-items:center;gap:8px;min-width:0}
.mm-brand .brandlogo{height:24px;max-width:120px}
.mm-sub{font-size:11px;font-weight:800;letter-spacing:.03em;color:#6b7280;text-transform:uppercase;line-height:1;white-space:nowrap}
.screenwrap.dark .mm-sub{color:#9aa3b2}
.logo .dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#A9B8FF,#4A4FC4);display:inline-block}
.hicons{display:flex;gap:8px}
.ic{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#374151;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ic .bdg{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.search input{border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;background:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 15px;border-radius:20px;background:#fff;font-size:12.5px;font-weight:600;color:#374151;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.hero{margin:8px 16px 4px;border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--teal2),var(--teald));color:#fff;position:relative;overflow:hidden}
.hero h3{font-family:'Nunito Sans';font-weight:900;letter-spacing:-.02em;font-size:23px;line-height:1.05}
.hero p{font-size:12.5px;opacity:.9;margin-top:4px}
.hero .btn{margin-top:12px;display:inline-block;background:#fff;color:var(--teal);font-size:12px;font-weight:700;padding:8px 16px;border-radius:20px}
.hero .blob{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.sec{padding:16px 16px 4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-t{font-family:'Nunito Sans';font-weight:900;letter-spacing:-.02em;font-size:17px;white-space:nowrap;color:var(--ink);display:flex;align-items:center;gap:8px}
.sec-a{font-size:12px;color:var(--teal);font-weight:600}
.timer{display:flex;gap:4px;align-items:center}
.timer span{background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.flash{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px}
.flash::-webkit-scrollbar{display:none}
.flash .pc{width:150px;flex-shrink:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
/* product card */
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column}
.pc-img{position:relative;aspect-ratio:1/.9;display:grid;place-items:center}
.pc-badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.b-disc{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:20px}
.b-tag{font-size:9px;font-weight:800;padding:3px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.b-new{background:var(--teal);color:#fff}.b-hot{background:var(--red);color:#fff}.b-top{background:var(--ink);color:#fff}
.pc-heart{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#9ca3af}
.pc-body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pc-brand{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.pc-name{font-size:12.5px;font-weight:500;line-height:1.25;color:var(--ink);min-height:2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-rate{font-size:10.5px;color:#d1d5db;cursor:pointer}
.pc-price{margin-top:auto;padding-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc-price b{font-family:'Nunito Sans';font-weight:900;letter-spacing:-.02em;font-size:16px;color:var(--ink)}
.pc-price s{font-size:11px;color:var(--mut)}
.pc-price small{font-size:10px;color:var(--mut)}
.pc-add{margin-top:8px;height:34px;border:none;border-radius:20px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pc-add:active{transform:scale(.97)}
.stepper{margin-top:8px;height:34px;border-radius:20px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.stepper button{width:26px;height:26px;border:none;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.stepper .m{background:#fff;color:var(--teal)}.stepper .p{background:var(--teal);color:#fff}
.stepper b{font-size:14px;color:var(--teal);font-variant-numeric:tabular-nums}
/* katalog */
.catrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px;margin:0 16px 10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.catrow .cico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.catrow .ct{flex:1}.catrow .ct b{font-size:14px;font-weight:600;color:var(--ink)}.catrow .ct span{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.catrow .arr{color:#cbd5e1}
/* cart */
.cart-item{display:flex;gap:12px;background:#fff;border-radius:16px;padding:12px;margin:0 16px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cart-item .ci-img{width:70px;height:70px;border-radius:12px;flex-shrink:0;display:grid;place-items:center}
.cart-item .ci-b{flex:1;min-width:0;display:flex;flex-direction:column}
.cart-summary{margin:4px 16px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sumrow{display:flex;justify-content:space-between;font-size:13px;color:#4b5563;padding:5px 0}
.sumrow.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:800;color:var(--ink);font-size:15px}
.checkout{margin:14px 16px 0;height:52px;border:none;border-radius:26px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;width:calc(100% - 32px);font-family:inherit;cursor:pointer}
.empty{padding:60px 24px;text-align:center;color:var(--mut)}
.empty .ei{width:70px;height:70px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto 14px;color:#cbd5e1}
/* profile */
.prof-card{margin:8px 16px 14px;background:linear-gradient(135deg,var(--teal2),var(--teald));border-radius:22px;padding:22px;color:#fff;text-align:center}
.prof-av{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:'Nunito Sans';font-weight:900;letter-spacing:-.02em;font-size:34px;margin:0 auto 12px}
.prof-card h3{font-family:'Nunito Sans';font-weight:900;letter-spacing:-.02em;font-size:19px}
.prof-card p{font-size:12.5px;opacity:.85;margin-top:2px}
.prof-badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700}
.mrow{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;padding:15px 16px;margin:0 16px 9px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mrow .mi{color:var(--teal)}.mrow b{flex:1;font-size:13.5px;font-weight:600}.mrow .arr{color:#cbd5e1}
.mrow .mb{min-width:22px;height:22px;border-radius:11px;background:var(--soft);color:#4b5563;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
/* tabbar */
.tabbar{flex-shrink:0;height:76px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 6px 20px;position:relative;z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#9ca3af;position:relative}
.tab.on{color:var(--teal)}
.tab span{font-size:10px;font-weight:600}
.tab .tb{position:absolute;top:-3px;right:22px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.fabc{width:58px;height:58px;border-radius:50%;margin-top:-38px;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 0 0 5px var(--card),0 4px 12px -2px rgba(13,124,136,.45);transition:transform .16s}
.tab.fab:active .fabc{transform:scale(.93)}
.tab.fab>span{position:relative;z-index:1;font-size:11.5px;font-weight:700;color:var(--fabtxt)}
.tab.fab.on>span{color:var(--teal)}
.tab.fab .tb{top:0;right:0}
.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:22px;opacity:0;transition:.25s;z-index:70;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pc-heart.on{color:var(--red)}
.pc-heart.on svg{fill:var(--red)}

  // regex qoidalari (raqamli/tarkibli iboralar). Tartib muhim.

  function ruleTr(raw){
    var s = norm(raw), out = s;
    for (var i=0;i<R.length;i++){ out = out.replace(R[i][0], R[i][1+LI]); }
    return out !== s ? out : null;
  }
  function phrase(raw){
    var lead = (raw.match(/^\s*/)||[""])[0], trail = (raw.match(/\s*$/)||[""])[0];
    var key = norm(raw).trim();
    if (!key) return null;
    if (D[key] != null) return lead + D[key][LI] + trail;
    var rt = ruleTr(raw);
    if (rt != null) return rt;
    // " · " bilan ajratilgan birikmalarni bo'lib tarjima qilish (masalan "Bajarildi · Buyurtma ...")
    if (key.indexOf(' · ') >= 0) {
      var parts = key.split(' · '), changed = false;
      var mapped = parts.map(function(pt){
        if (D[pt] != null) { changed = true; return D[pt][LI]; }
        var rr = ruleTr(pt); if (rr != null) { changed = true; return rr; }
        return pt;
      });
      if (changed) return lead + mapped.join(' · ') + trail;
    }
    return null;
  }
  function trTextNode(n){
    var r = phrase(n.nodeValue);
    if (r != null && r !== n.nodeValue) n.nodeValue = r;
  }
  function walk(root){
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), n;
    var arr = [];
    while ((n = w.nextNode())) arr.push(n);
    arr.forEach(trTextNode);
    // placeholderlar
    var ph = root.querySelectorAll ? root.querySelectorAll('[placeholder]') : [];
    for (var i=0;i<ph.length;i++){
      var v = ph[i].getAttribute('placeholder');
      var key = norm(v).trim();
      if (D[key] != null) ph[i].setAttribute('placeholder', D[key][LI]);
      else { var rr = ruleTr(v); if (rr) ph[i].setAttribute('placeholder', rr); }
    }
  }

  var wrap;
  function run(){
    wrap = document.getElementById('wrap') || document.body;
    walk(wrap);
    var obs = new MutationObserver(function(muts){
      obs.disconnect();
      // butun wrapни qayta yurish (yangi qo'shilgan tugunlar uchun)
      walk(wrap);
      obs.observe(wrap, {childList:true, subtree:true, characterData:true});
    });
    obs.observe(wrap, {childList:true, subtree:true, characterData:true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
