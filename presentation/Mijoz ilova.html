  <script>
  // PHONE-ONLY: prezentatsiyada ham, alohida ochilganda ham faqat telefon
  (function(){
    function findPhone(){
      var best=null, ba=0;
      var els=document.querySelectorAll('div');
      for(var i=0;i<els.length;i++){
        var el=els[i];
        if(el.id==='ican-bezel'||el.id==='ican-watermark'||el.id==='__alov') continue;
        var s=getComputedStyle(el);
        var br=parseFloat(s.borderRadius)||0;
        if(br<24) continue;
        var r=el.getBoundingClientRect();
        if(r.width>=200 && r.width<=560 && r.height>=380 && r.height<=1000){
          var a=r.width*r.height;
          if(a>ba){ba=a;best=el;}
        }
      }
      return best;
    }
    function apply(){
      var ph=findPhone();
      if(!ph) return false;
      var node=ph;
      while(node && node!==document.body){
        var parent=node.parentElement;
        if(!parent) break;
        for(var i=0;i<parent.children.length;i++){
          var sib=parent.children[i];
          if(sib!==node && sib.id!=='__alov' && sib.id!=='ican-watermark' && sib.id!=='ican-bezel'){ sib.style.setProperty('display','none','important'); }
        }
        parent.style.setProperty('display','flex','important');
        parent.style.setProperty('align-items','center','important');
        parent.style.setProperty('justify-content','center','important');
        parent.style.setProperty('background','transparent','important');
        parent.style.setProperty('box-shadow','none','important');
        parent.style.setProperty('border','none','important');
        parent.style.setProperty('padding','0','important');
        parent.style.setProperty('margin','0','important');
        parent.style.setProperty('width','auto','important');
        parent.style.setProperty('height','auto','important');
        parent.style.setProperty('min-height','0','important');
        parent.style.setProperty('max-width','none','important');
        node=parent;
      }
      // masshtab: telefon viewportga sig'sin (standalone'da katta, iframe'da mos)
      var wrap=ph.parentElement;
      while(wrap && wrap!==document.body){
        var s=getComputedStyle(wrap);
        if(s.transform && s.transform!=='none') break;
        wrap=wrap.parentElement;
      }
      var inIfr=false;try{inIfr=window.self!==window.top;}catch(e){}
      var scale=inIfr?0.9302:1.0;
      if(wrap && wrap!==document.body){
        wrap.style.setProperty('transform','scale('+scale.toFixed(3)+')','important');
        wrap.style.setProperty('transform-origin','center center','important');
      }
      // telefon tashqarisidagi soyalar va katta fonlarni tozalash
      var all=document.querySelectorAll('*');
      for(var j=0;j<all.length;j++){
        var el2=all[j];
        if(el2===ph||ph.contains(el2)||el2.id==='ican-watermark'||el2.id==='ican-bezel') continue;
        var s2=getComputedStyle(el2);
        if(s2.boxShadow!=='none'||s2.filter.indexOf('drop-shadow')>=0){
          el2.style.setProperty('box-shadow','none','important');
          el2.style.setProperty('filter','none','important');
        }
        var r2=el2.getBoundingClientRect();
        if(r2.width>=window.innerWidth*0.85 && r2.height>=window.innerHeight*0.85){
          var bgc=s2.backgroundColor;
          if(bgc && bgc!=='rgba(0, 0, 0, 0)' && bgc!=='transparent'){
            el2.style.setProperty('background','transparent','important');
            el2.style.setProperty('background-image','none','important');
          }
        }
      }
      var bg=(function(){try{return window.self!==window.top?'transparent':'#EAEBF2';}catch(e){return '#EAEBF2';}})();
      document.body.style.setProperty('display','flex','important');
      document.body.style.setProperty('align-items','center','important');
      document.body.style.setProperty('justify-content','center','important');
      document.body.style.setProperty('min-height','100vh','important');
      document.body.style.setProperty('overflow','hidden','important');
      document.body.style.setProperty('background',bg,'important');
      document.documentElement.style.setProperty('background',bg,'important');
      window.__phoneOnlyDone = true;
      return true;
    }
    var tries=0;
    var iv=setInterval(function(){
      tries++;
      var t=document.body?document.body.innerText:'';
      if(t.indexOf('Mavjud')>=0 || tries>50){
        if(apply() || tries>60){ window.__phoneOnlyDone = true; clearInterval(iv); setInterval(apply, 1500); }
      }
    },150);
  })();

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

D7DBE3;\n  --muted: #8B93A3;\n  --muted-2: #5A6273;\n  --line: rgba(255,255,255,0.09);\n  --line-2: rgba(255,255,255,0.05);\n  --brand-soft: color-mix(in srgb, var(--brand) 26%, #161A22);\n  --brand-tint: color-mix(in srgb, var(--brand) 16%, #161A22);\n  --ok-soft: color-mix(in srgb, var(--ok) 22%, #161A22);\n  --warn-soft: color-mix(in srgb, var(--warn) 22%, #161A22);\n  --danger-soft: color-mix(in srgb, var(--danger) 22%, #161A22);\n  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3), 0 3px 10px rgba(0,0,0,0.3);\n}\n\n* { box-sizing: border-box; }\n\n.app {\n  height: 100%;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--ff);\n  -webkit-font-smoothing: antialiased;\n  display: flex;\n  flex-direction: column;\n  position: relative;\n  letter-spacing: -0.01em;\n}\n.app button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }\n.app .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }\n\n/* \u2500\u2500 scroll region \u2500\u2500 */\n.scroll {\n  flex: 1;\n  overflow-y: auto;\n  overflow-x: hidden;\n  -webkit-overflow-scrolling: touch;\n  padding-bottom: 26px;\n}\n.scroll::-webkit-scrollbar { width: 0; }\n.has-tabs .scroll { padding-bottom: 96px; }\n\n/* \u2500\u2500 top app bar \u2500\u2500 */\n.appbar {\n  padding: 60px 20px 12px;\n  display: flex; align-items: center; justify-content: space-between; gap: 12px;\n  position: relative; z-index: 4;\n}\n.appbar.solid { background: var(--surface); border-bottom: 1px solid var(--line); }\n.appbar .greet small { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 2px; font-weight: 500; }\n.appbar .greet b { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; }\n.appbar-title { font-size: 18px; font-weight: 680; letter-spacing: -0.02em; }\n\n.iconbtn {\n  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;\n  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); position: relative;\n}\n.iconbtn.flat { background: var(--surface-2); box-shadow: none; }\n.iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;\n  border-radius: 99px; background: var(--danger); border: 2px solid var(--surface); }\n\n.brandmark {\n  display: flex; align-items: center; gap: 9px;\n}\n.brandmark .logo {\n  height: 30px; min-width: 30px; padding: 0 9px; border-radius: 9px;\n  background: var(--brand); color: var(--on-brand);\n  display: grid; place-items: center;\n  font-weight: 800; font-size: 14px; letter-spacing: 0.04em;\n}\n.brandmark .sub { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }\n\n/* sub-nav back header */\n.subhead { padding: 56px 16px 10px; display: flex; align-items: center; gap: 6px; position: relative; z-index: 4; }\n.subhead .back { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); }\n.subhead h2 { margin: 0; font-size: 17px; font-weight: 680; flex: 1; }\n\n/* \u2500\u2500 containers \u2500\u2500 */\n.pad { padding: 0 20px; }\n.stack { display: flex; flex-direction: column; }\n.gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }\n.row { display: flex; align-items: center; }\n.between { justify-content: space-between; }\n.grow { flex: 1; }\n\n/* \u2500\u2500 card \u2500\u2500 */\n.card {\n  background: var(--surface); border-radius: var(--r);\n  box-shadow: var(--shadow); padding: 18px;\n}\n.card.tight { padding: 14px; }\n.card.flat { box-shadow: none; border: 1px solid var(--line); }\n\n.section-label {\n  font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em;\n  padding: 0 4px; display: flex; align-items: center; justify-content: space-between;\n}\n.section-label a { color: var(--brand); font-weight: 600; }\n\n/* \u2500\u2500 hero limit card \u2500\u2500 */\n.hero {\n  border-radius: var(--r-lg); padding: 22px;\n  background:\n    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--brand) 75%, #fff) 0%, transparent 55%),\n    linear-gradient(150deg, var(--brand) 0%, var(--brand-700) 100%);\n  color: var(--on-brand); position: relative; overflow: hidden;\n  box-shadow: 0 12px 30px color-mix(in srgb, var(--brand) 40%, transparent);\n}\n.hero .glow { position: absolute; right: -40px; top: -50px; width: 180px; height: 180px;\n  background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 70%); }\n.hero .k { font-size: 12.5px; opacity: 0.85; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: center; gap: 6px; }\n.hero .big { font-size: 38px; font-weight: 720; letter-spacing: -0.03em; margin: 6px 0 2px; line-height: 1; }\n.hero .big .cur { font-size: 17px; font-weight: 600; opacity: 0.8; margin-left: 6px; letter-spacing: 0; }\n.hero .meterwrap { margin-top: 16px; }\n.hero .meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.25); overflow: hidden; }\n.hero .meter > span { display: block; height: 100%; border-radius: 99px; background: #fff; }\n.hero .meta { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12px; font-weight: 500; }\n.hero .meta b { font-weight: 700; }\n.hero .meta .o { opacity: 0.78; }\n\n/* quick actions */\n.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n.qa {\n  background: var(--surface); border-radius: var(--r-sm); padding: 14px 8px 12px;\n  display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);\n  text-align: center;\n}\n.qa .ic { width: 42px; height: 42px; border-radius: 13px; background: var(--brand-soft); color: var(--brand);\n  display: grid; place-items: center; }\n.qa span { font-size: 11.5px; font-weight: 600; color: var(--ink-2); line-height: 1.2; }\n.qa:active { transform: scale(0.96); }\n.app .qa, .app .pressable { transition: transform 0.12s ease; }\n.pressable:active { transform: scale(0.98); }\n\n/* \u2500\u2500 list rows \u2500\u2500 */\n.lrow { display: flex; align-items: center; gap: 13px; padding: 13px 0; }\n.lrow + .lrow { border-top: 1px solid var(--line); }\n.lrow .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;\n  background: var(--surface-2); color: var(--ink-2); flex-shrink: 0; }\n.lrow .ic.brand { background: var(--brand-soft); color: var(--brand); }\n.lrow .tt { flex: 1; min-width: 0; }\n.lrow .tt b { font-size: 14.5px; font-weight: 620; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.lrow .tt small { font-size: 12px; color: var(--muted); display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.lrow .rt { text-align: right; flex-shrink: 0; }\n.lrow .rt b { font-size: 14.5px; font-weight: 680; }\n.lrow .rt small { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; }\n\n/* \u2500\u2500 chips / status \u2500\u2500 */\n.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650;\n  padding: 4px 9px; border-radius: 99px; letter-spacing: 0; }\n.chip .d { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }\n.chip.ok { background: var(--ok-soft); color: var(--ok); }\n.chip.warn { background: var(--warn-soft); color: var(--warn); }\n.chip.danger { background: var(--danger-soft); color: var(--danger); }\n.chip.brand { background: var(--brand-soft); color: var(--brand); }\n.chip.flat { background: var(--surface-2); color: var(--muted); }\n\n/* \u2500\u2500 buttons \u2500\u2500 */\n.btn {\n  height: 54px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;\n  gap: 9px; font-size: 16px; font-weight: 660; width: 100%; letter-spacing: -0.01em; white-space: nowrap;\n  transition: transform 0.12s ease, opacity 0.12s ease;\n}\n.btn:active { transform: scale(0.98); }\n.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 30%, transparent); }\n.btn.dark { background: var(--ink); color: var(--surface); }\n.btn.soft { background: var(--brand-soft); color: var(--brand); }\n.btn.ghost { background: var(--surface-2); color: var(--ink); }\n.btn.outline { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }\n.btn:disabled { opacity: 0.4; pointer-events: none; }\n.btn.sm { height: 44px; font-size: 14.5px; border-radius: 13px; }\n\n/* sticky footer cta */\n.footer-cta {\n  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px;\n  background: linear-gradient(to top, var(--bg) 62%, transparent);\n  z-index: 6;\n}\n.footer-cta.surface { background: var(--surface); border-top: 1px solid var(--line); padding-bottom: 28px; }\n\n/* \u2500\u2500 tab bar \u2500\u2500 */\n.tabbar {\n  position: absolute; left: 0; right: 0; bottom: 0; height: 84px;\n  padding: 8px 8px 22px; z-index: 8;\n  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;\n  background: color-mix(in srgb, var(--surface) 86%, transparent);\n  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);\n  border-top: 1px solid var(--line);\n}\n.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted-2); }\n.tab.active { color: var(--brand); }\n.tab span { font-size: 10.5px; font-weight: 600; }\n.tab .fab {\n  width: 50px; height: 50px; margin-top: -16px; border-radius: 17px; background: var(--brand);\n  color: var(--on-brand); display: grid; place-items: center;\n  box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 38%, transparent);\n}\n\n/* \u2500\u2500 inputs \u2500\u2500 */\n.field { background: var(--surface); border-radius: var(--r-sm); border: 1.5px solid var(--line);\n  padding: 13px 15px; display: flex; align-items: center; gap: 10px; transition: border-color 0.15s; }\n.field.focus, .field:focus-within { border-color: var(--brand); }\n.field label { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px; }\n.field input { border: 0; outline: 0; background: transparent; width: 100%; font-family: inherit;\n  font-size: 16px; font-weight: 600; color: var(--ink); }\n.field input::placeholder { color: var(--muted-2); font-weight: 500; }\n.fieldlbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 0 4px 7px; }\n\n/* segmented */\n.seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 4px; gap: 4px; }\n.seg button { flex: 1; height: 38px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); }\n.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }\n\n/* term / option selector */\n.optcard { border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 14px; background: var(--surface);\n  display: flex; align-items: center; gap: 12px; transition: border-color 0.15s, background 0.15s; }\n.optcard.on { border-color: var(--brand); background: var(--brand-tint); }\n.optcard .radio { width: 22px; height: 22px; border-radius: 99px; border: 2px solid var(--line); flex-shrink: 0;\n  display: grid; place-items: center; }\n.optcard.on .radio { border-color: var(--brand); }\n.optcard.on .radio::after { content: \"\"; width: 11px; height: 11px; border-radius: 99px; background: var(--brand); }\n\n/* schedule timeline */\n.sch { position: relative; }\n.sch .srow { display: flex; align-items: center; gap: 14px; padding: 11px 0; position: relative; }\n.sch .srow + .srow { border-top: 1px solid var(--line); }\n.sch .node { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; flex-shrink: 0;\n  font-size: 12px; font-weight: 700; border: 2px solid var(--line); color: var(--muted); background: var(--surface); }\n.sch .node.paid { background: var(--ok); border-color: var(--ok); color: #fff; }\n.sch .node.next { background: var(--brand); border-color: var(--brand); color: #fff; }\n.sch .node.overdue { background: var(--danger); border-color: var(--danger); color: #fff; }\n\n/* bottom sheet */\n.sheet-scrim { position: absolute; inset: 0; background: rgba(8,11,18,0.45); z-index: 30;\n  opacity: 0; transition: opacity 0.25s; }\n.sheet-scrim.show { opacity: 1; }\n.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;\n  background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 20px 30px;\n  transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);\n  max-height: 86%; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }\n.sheet.show { transform: translateY(0); }\n.sheet .grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }\n.sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }\n\n/* success check */\n.successmark { width: 88px; height: 88px; border-radius: 99px; background: var(--ok-soft); color: var(--ok);\n  display: grid; place-items: center; margin: 0 auto; animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }\n@keyframes pop { from { transform: scale(0.86); } to { transform: scale(1); } }\n\n/* fade for screen transitions \u2014 no fill-mode, so a non-running animation leaves content visible */\n.screen { animation: fadeUp 0.32s ease; height: 100%; display: flex; flex-direction: column; }\n@keyframes fadeUp { from { transform: translateY(10px); } to { transform: none; } }\n.scroll > .pad { animation: fadeUp 0.36s ease; }\n\n/* keypad */\n.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n.keypad button { height: 56px; border-radius: 14px; font-size: 22px; font-weight: 600; background: var(--surface-2); }\n.keypad button:active { background: var(--brand-soft); color: var(--brand); }\n\n/* otp boxes */\n.otp { display: flex; gap: 10px; justify-content: center; }\n.otp .box { width: 48px; height: 58px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);\n  display: grid; place-items: center; font-size: 26px; font-weight: 700; }\n.otp .box.on { border-color: var(--brand); }\n.otp .box.cursor { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }\n\n/* spinner */\n.spinner { width: 54px; height: 54px; border-radius: 99px; border: 5px solid var(--brand-soft);\n  border-top-color: var(--brand); animation: spin 0.8s linear infinite; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* qr scan line */\n@keyframes qrscan { 0% { top: 8%; } 50% { top: 88%; } 100% { top: 8%; } }\n\n/* misc text */\n.muted { color: var(--muted); }\n.tiny { font-size: 11.5px; }\n.amount-display { font-size: 40px; font-weight: 740; letter-spacing: -0.03em; text-align: center; }\n.amount-display .cur { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 6px; }\n<\/style>\n<style>\n  html,body{margin:0;}\n  .zdemo{font-family:'Hanken Grotesk',-apple-system,system-ui,sans-serif;}\n  .zdemo h1{font-family:'Onest','Hanken Grotesk',sans-serif;}\n<\/style>\n<\/helmet>\n\n<div style=\"min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#CFD0E0;padding:24px;\">\n<div class=\"zdemo\" style=\"width:1160px;height:700px;flex:none;display:flex;align-items:center;gap:60px;padding:40px 64px;border-radius:32px;overflow:hidden;background:radial-gradient(130% 120% at 10% 0%, #F7F7FB 0%, #ECEDF6 55%, #E1E2EF 100%);box-shadow:0 30px 70px rgba(20,21,43,0.22);\">\n\n  <div style=\"flex:1 1 auto;max-width:470px;\">\n    <div style=\"display:inline-flex;align-items:center;justify-content:center;background:var(--accent-press,#242373);color:#fff;font-family:'Onest',sans-serif;font-weight:800;font-size:24px;letter-spacing:0.01em;padding:10px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(36,35,115,0.28);\"><
